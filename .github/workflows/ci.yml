name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx expo-doctor

      # O build do app (EAS) roda fora do CI padrao e exige credenciais.
      # TODO: adicionar workflow de build EAS quando as credenciais estiverem configuradas.
